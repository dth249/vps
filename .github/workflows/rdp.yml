name: Windows-RDP-Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP & Cloudflare Tunnel
        shell: powershell
        run: |
          # 1. Bật RDP và mở tường lửa
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # 2. Đặt mật khẩu cho tài khoản runneradmin
          net user runneradmin "MatKhauManh123@"

          # 3. Tải cloudflared
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

          # 4. Khởi chạy tunnel RDP và ghi log ra file
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389 --logfile tunnel.log"

          # 5. Chờ tunnel tạo domain kết nối
          Start-Sleep -Seconds 10

          # 6. Tìm hostname trycloudflare
          $url = ""
          for ($i = 0; $i -lt 15; $i++) {
              if (Test-Path tunnel.log) {
                  $content = Get-Content tunnel.log
                  $match = $content | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
                  if ($match) {
                      $url = $match.Matches[0].Value -replace "https://", ""
                      break
                  }
              }
              Start-Sleep -Seconds 2
          }

          if ($url) {
              Write-Host "`n=======================================================" -ForegroundColor Green
              Write-Host "Domain RDP : $url" -ForegroundColor Yellow
              Write-Host "Username   : runneradmin" -ForegroundColor Yellow
              Write-Host "Password   : MatKhauManh123@" -ForegroundColor Yellow
              Write-Host "=======================================================`n" -ForegroundColor Green
          } else {
              Get-Content tunnel.log
              throw "Khong lay duoc domain Cloudflare!"
          }

      - name: Keep Alive (6 Hours)
        shell: powershell
        run: |
          $timeout = 21600
          Start-Sleep -Seconds $timeout
