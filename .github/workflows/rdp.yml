name: Windows-RDP-Direct

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Direct RDP
        shell: powershell
        run: |
          # 1. Khong dung tien trinh khi gap warning cua OpenSSH
          $ErrorActionPreference = "Continue"

          # 2. Bat Remote Desktop va Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # 3. Dat mat khau dang nhap
          net user runneradmin "MatKhauManh123@"

          # 4. Chay Serveo voi cac co tat TTY (-N, -T) va ghi log truc tiep
          $sshCmd = 'ssh -N -T -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -R 0:localhost:3389 serveo.net'
          Start-Process cmd.exe -ArgumentList "/c $sshCmd > serveo.log 2>&1"

          # 5. Doc IP/Port tu file log
          $addr = ""
          for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "serveo.log") {
                  $content = Get-Content "serveo.log" -Raw
                  $match = [regex]::Match($content, 'Forwarding TCP traffic from ([a-zA-Z0-9\.\-]+:[0-9]+)')
                  if ($match.Success) {
                      $addr = $match.Groups[1].Value
                      break
                  }
              }
          }

          if ($addr) {
              Write-Host "`n=======================================================" -ForegroundColor Green
              Write-Host "THONG TIN DANG NHAP RDP:" -ForegroundColor Yellow
              Write-Host "Computer (Host:Port) : $addr" -ForegroundColor Cyan
              Write-Host "Username             : runneradmin" -ForegroundColor Yellow
              Write-Host "Password             : MatKhauManh123@" -ForegroundColor Yellow
              Write-Host "=======================================================`n" -ForegroundColor Green
          } else {
              Write-Host "LOG CHI TIET:"
              Get-Content "serveo.log" -ErrorAction SilentlyContinue
              throw "Khong the lay thong tin dia chi tu Serveo!"
          }

          # 6. Giu may hoat dong
          $timeout = 21600
          Start-Sleep -Seconds $timeout
