name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Ngrok & Enable RDP
        shell: powershell
        run: |
          # Bật RDP và mở port tường lửa
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          # Đổi mật khẩu tài khoản runneradmin
          net user runneradmin "MatKhauManh123@"
          
          # Cài đặt Ngrok qua Chocolatey (ổn định hơn tải file zip)
          choco install ngrok -y --no-progress
          
          # Cấu hình Token và bật web_addr cục bộ
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
          # Khởi chạy ngrok service chạy nền
          $process = Start-Process ngrok -ArgumentList "tcp 3389" -PassThru
          
          # Chờ tiến trình khởi động hoàn tất
          Start-Sleep -Seconds 8
          
          # Lấy thông tin URL RDP
          try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 10
              $tunnel = $response.tunnels[0].public_url
              Write-Host "`n==========================================" -ForegroundColor Green
              Write-Host "RDP Address : $tunnel" -ForegroundColor Yellow
              Write-Host "Username    : runneradmin" -ForegroundColor Yellow
              Write-Host "Password    : MatKhauManh123@" -ForegroundColor Yellow
              Write-Host "==========================================`n" -ForegroundColor Green
          } catch {
              Write-Host "Khong the lay dia chi Ngrok. Kiem tra xem Token da add dung chua hoac kiem tra tren Dashboard Ngrok!" -ForegroundColor Red
              throw $_
          }

      - name: Keep Alive (6 Hours)
        shell: powershell
        run: |
          $timeout = 21600
          Start-Sleep -Seconds $timeout
