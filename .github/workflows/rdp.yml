name: Windows-RDP-Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Windows RDP with Tailscale
        shell: powershell
        run: |
          # 1. Bat Remote Desktop va mo firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # 2. Dat mat khau
          net user runneradmin "MatKhauManh123@"

          # 3. Cai dat va chay Tailscale
          choco install tailscale -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # 4. Ket noi mang noi bo bang Auth Key
          # Thay tskey-auth-xxxx bang Auth Key ban vua lay o Buoc 1
          $TAILSCALE_KEY = "tskey-auth-kCCda1Pz3V11CNTRL-B3kBeb3KYne5tvUp27fMneJDjiLNKbN8K"
          
          tailscale up --authkey $TAILSCALE_KEY --hostname "github-vps" --unattended

          # 5. Lay IP Tailscale va in ra man hinh
          Start-Sleep -Seconds 5
          $ip = tailscale ip -4

          Write-Host "`n=======================================================" -ForegroundColor Green
          Write-Host "KET NOI THANH CONG! THONG TIN DANG NHAP:" -ForegroundColor Yellow
          Write-Host "Computer (IP Tailscale) : $ip" -ForegroundColor Cyan
          Write-Host "Username                : runneradmin" -ForegroundColor Yellow
          Write-Host "Password                : MatKhauManh123@" -ForegroundColor Yellow
          Write-Host "=======================================================`n" -ForegroundColor Green

          # 6. Duy tri may hoat dong
          $timeout = 21600
          Start-Sleep -Seconds $timeout
